<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Energy Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .alert-banner {
            display: none;
            background-color: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }

        .alert-banner.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .room-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .room-card.overload {
            background-color: #ffe0e0;
            border: 2px solid #dc3545;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 4px 6px rgba(220, 53, 69, 0.3);
            }
            50% {
                box-shadow: 0 4px 12px rgba(220, 53, 69, 0.6);
            }
        }

        .room-card:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .room-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #ccc;
            transition: background-color 0.3s;
        }

        .status-indicator.on {
            background-color: #28a745;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
        }

        .status-indicator.off {
            background-color: #6c757d;
        }

        .power-display {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .power-unit {
            font-size: 0.5em;
            color: #666;
        }

        .control-section {
            margin-top: 15px;
        }

        .toggle-switch {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #28a745;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .limit-control {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .limit-control label {
            font-size: 0.9em;
            color: #666;
            flex-shrink: 0;
        }

        .limit-control input {
            flex: 1;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .limit-control button {
            padding: 6px 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background-color 0.3s;
        }

        .limit-control button:hover {
            background-color: #5568d3;
        }

        .home-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .home-section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .home-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .home-budget-control {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .home-budget-control label {
            font-weight: bold;
            color: #333;
            flex-shrink: 0;
        }

        .home-budget-control input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }

        .home-budget-control button {
            padding: 8px 16px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .home-budget-control button:hover {
            background-color: #5568d3;
        }

        .status-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .rooms-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Smart Energy Hub</h1>
            <p>Real-time home energy monitoring and control</p>
        </div>

        <div class="alert-banner" id="alertBanner"></div>

        <div class="rooms-grid" id="roomsGrid">
            <div class="loading">Loading data...</div>
        </div>

        <div class="home-section">
            <h2>🏠 Home Overview</h2>
            
            <div class="home-stats">
                <div class="stat-box">
                    <div class="stat-label">Total Power Consumption</div>
                    <div class="stat-value" id="totalPower">0<span class="power-unit">W</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Home Budget</div>
                    <div class="stat-value" id="homeBudget">4000<span class="power-unit">W</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Remaining Capacity</div>
                    <div class="stat-value" id="remaining">4000<span class="power-unit">W</span></div>
                </div>
            </div>

            <div class="home-budget-control">
                <label for="budgetInput">Set Home Budget (W):</label>
                <input type="number" id="budgetInput" min="1000" max="10000" value="4000" step="100">
                <button onclick="setHomeBudget()">Update Budget</button>
            </div>

            <div class="status-text" id="statusText">Status: NORMAL</div>
        </div>
    </div>

    <script>
        const REFRESH_INTERVAL = 2000; // 2 seconds
        let currentBudget = 4000;

        async function fetchData() {
            try {
                const response = await fetch('/data');
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('roomsGrid').innerHTML = 
                    '<div class="loading">Error loading data. Retrying...</div>';
            }
        }

        function updateUI(data) {
            updateRoomCards(data.rooms);
            updateHomeStats(data.total);
            updateAlert(data);
        }

        function updateRoomCards(rooms) {
            const grid = document.getElementById('roomsGrid');
            let html = '';

            for (const [roomId, room] of Object.entries(rooms)) {
                const isOn = room.state === 'ON';
                const isOverload = isOn && room.power > 1000; // Assuming default 1000W limit
                
                html += `
                    <div class="room-card ${isOverload ? 'overload' : ''}">
                        <div class="room-header">
                            <div class="room-name">${room.name}</div>
                            <div class="status-indicator ${isOn ? 'on' : 'off'}"></div>
                        </div>
                        
                        <div class="power-display">
                            ${room.power}<span class="power-unit">W</span>
                        </div>
                        
                        <div class="control-section">
                            <div class="toggle-switch">
                                <span>${isOn ? 'ON' : 'OFF'}</span>
                                <label class="switch">
                                    <input type="checkbox" ${isOn ? 'checked' : ''} 
                                           onchange="toggleRoom('${roomId}')">
                                    <span class="slider"></span>
                                </label>
                            </div>
                            
                            <div class="limit-control">
                                <label for="limit${roomId}">Max Power:</label>
                                <input type="number" id="limit${roomId}" 
                                       placeholder="1000" min="100" max="2000" value="1000">
                                <button onclick="setRoomMaxPower('${roomId}')">Set</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        function updateHomeStats(totalPower) {
            document.getElementById('totalPower').innerHTML = 
                `${totalPower}<span class="power-unit">W</span>`;
            
            const remaining = Math.max(0, currentBudget - totalPower);
            document.getElementById('remaining').innerHTML = 
                `${remaining}<span class="power-unit">W</span>`;
        }

        function updateAlert(data) {
            const banner = document.getElementById('alertBanner');
            const statusText = document.getElementById('statusText');
            
            if (data.total > currentBudget) {
                banner.innerHTML = '🚨 HOME OVERLOAD ALERT! Total consumption exceeds budget!';
                banner.classList.add('show');
                statusText.textContent = 'Status: HOME OVERLOAD';
            } else {
                banner.classList.remove('show');
                statusText.textContent = 'Status: NORMAL';
            }
        }

        async function toggleRoom(roomId) {
            try {
                await fetch(`/toggle?room=${roomId}`, { method: 'POST' });
                setTimeout(fetchData, 500);
            } catch (error) {
                console.error('Error toggling room:', error);
            }
        }

        async function setRoomMaxPower(roomId) {
            const value = parseInt(document.getElementById(`limit${roomId}`).value);
            if (isNaN(value) || value < 100 || value > 2000) {
                alert('Invalid power limit. Must be between 100 and 2000.');
                return;
            }
            try {
                await fetch(`/set_mp?room=${roomId}&value=${value}`, { method: 'POST' });
            } catch (error) {
                console.error('Error setting max power:', error);
            }
        }

        async function setHomeBudget() {
            const value = parseInt(document.getElementById('budgetInput').value);
            if (isNaN(value) || value < 1000 || value > 10000) {
                alert('Invalid budget. Must be between 1000 and 10000.');
                return;
            }
            currentBudget = value;
            document.getElementById('homeBudget').innerHTML = 
                `${value}<span class="power-unit">W</span>`;
            try {
                await fetch(`/set_hp?value=${value}`, { method: 'POST' });
            } catch (error) {
                console.error('Error setting home budget:', error);
            }
        }

        // Initial load and auto-refresh
        fetchData();
        setInterval(fetchData, REFRESH_INTERVAL);
    </script>
</body>
</html>
